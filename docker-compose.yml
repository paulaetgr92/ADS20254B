version: "3.9"

services:
  db:
    image: postgres:16
    container_name: awesome_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: awesome_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: awesome_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8080:80"
    depends_on:
      - db

  api:
    build: .
    container_name: awesome_api
    restart: always
    depends_on:
      - db
    environment:
      DB_SOURCE: "postgresql://postgres:postgres@db:5432/awesome_db?sslmode=disable"
      JWT_SECRET: "minha_chave_secreta"
      PORT: "8081"
    ports:
      - "8081:8081"
    volumes:
      - .:/app
    command: ["go", "run", "main.go"]

volumes:
  db_data:
